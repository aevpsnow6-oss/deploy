openapi: 3.1.0
info:
  title: ILO PRODOC Quality Appraisal v3 Action API
  version: 0.1.0
  description: >
    Starts and retrieves experimental v3 ILO PRODOC quality-appraisal jobs.
    Each criterion is evaluated 10 independent times; results return one modal
    result per criterion with stability percentage and principal drift when
    unstable. Replace the server URL with the HTTPS domain where the API is
    deployed before importing this schema into the Custom GPT editor.
servers:
  - url: https://ilo-prodoc-appraisal-v3.onrender.com
security:
  - ApiKeyAuth: []
paths:
  /v3/jobs:
    post:
      operationId: startV3AppraisalJob
      summary: Start a v3 PRODOC quality-appraisal job
      description: >
        Starts the evaluation and returns immediately with start_line. Relay
        start_line verbatim, tell the user to write "estado" to check progress,
        and end the assistant turn. Do not call the status endpoint in the same
        turn as this operation.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - openaiFileIdRefs
              properties:
                openaiFileIdRefs:
                  type: array
                  description: >
                    Exactly one DOCX PRODOC uploaded by the user. ChatGPT will
                    populate this array with file reference objects containing
                    name, id, mime_type, and download_link.
                  minItems: 1
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      id:
                        type: string
                      mime_type:
                        type: string
                      download_link:
                        type: string
                        format: uri
                    required:
                      - name
                      - download_link
                sections:
                  type: array
                  description: Optional section numbers to evaluate, e.g. [1, 2].
                  items:
                    type: integer
                subsections:
                  type: array
                  description: Optional subsection IDs to evaluate, e.g. ["1.1", "2.3"].
                  items:
                    type: string
                max_workers:
                  type: integer
                  description: Parallel OpenAI calls for repeated criterion evaluation. Default is 48.
                  minimum: 1
                  maximum: 48
                language:
                  type: string
                  enum: [es, en]
                  default: es
                  description: >-
                    Output language of the XLSX. Use 'en' when the user asks for
                    the report in English. Presentation only; verdicts are
                    identical in both languages.
      responses:
        "200":
          description: Job was accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                  message:
                    type: string
                  start_line:
                    type: string
                    description: >
                      Sentence confirming what was received and how long it will
                      take. Relay it verbatim, ask the user to write "estado",
                      and end the turn without polling.
                  document_name:
                    type: string
                  document_word_count:
                    type: integer
                  criteria_count:
                    type: integer
                  total:
                    type: integer
                  estimated_seconds:
                    type: integer
  /v3/jobs/{job_id}:
    get:
      operationId: getV3AppraisalJobStatus
      summary: Get v3 appraisal job status
      description: >
        Call once per user progress request. If queued or running, relay
        progress_line verbatim, ask the user to write "estado" again, and end
        the turn without polling. If succeeded, call getV3AppraisalResult. If
        failed, report the error and end the turn.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current job status and summary when available.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - queued
                      - running
                      - succeeded
                      - failed
                  message:
                    type: string
                  progress_line:
                    type: string
                    description: >
                      A ready-to-use sentence describing current progress.
                      Relay it verbatim; do not rewrite it or make another
                      status call in the same turn while the job is running.
                  percent_complete:
                    type: number
                  eta_seconds:
                    type: integer
                  completed:
                    type: integer
                  total:
                    type: integer
                  document_name:
                    type: string
                  document_word_count:
                    type: integer
                  error:
                    type: string
  /v3/jobs/{job_id}/result:
    get:
      operationId: getV3AppraisalResult
      summary: Get v3 appraisal XLSX result
      description: >
        Returns a compact summary and the XLSX via an openaiFileResponse URL.
        The workbook includes the user view and technical audit. Call only
        after status is succeeded.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completed result and downloadable XLSX file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                  summary:
                    type: object
                  openaiFileResponse:
                    type: array
                    items:
                      type: string
                      format: uri
                      description: Tokenized URL fetched by ChatGPT as a file.
components:
  schemas: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
