openapi: 3.1.0
info:
  title: ILO PRODOC Quality Appraisal v3 Action API
  version: 0.1.0
  description: >
    Starts and retrieves experimental v3 ILO PRODOC quality-appraisal jobs.
    Each criterion is evaluated 10 independent times; results return one modal
    result per criterion with stability percentage and principal drift when
    unstable. Replace the server URL with the HTTPS domain where the API is
    deployed before importing this schema into the Custom GPT editor.
servers:
  - url: https://ilo-prodoc-appraisal-v3.onrender.com
security:
  - ApiKeyAuth: []
paths:
  /v3/jobs:
    post:
      operationId: startV3AppraisalJob
      summary: Start a v3 PRODOC quality-appraisal job
      description: >
        Starts the evaluation and returns immediately with start_line: a sentence naming the document and the estimated time. Write start_line to the user verbatim before you begin polling the status endpoint.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - openaiFileIdRefs
              properties:
                openaiFileIdRefs:
                  type: array
                  description: >
                    Exactly one DOCX PRODOC uploaded by the user. ChatGPT will
                    populate this array with file reference objects containing
                    name, id, mime_type, and download_link.
                  minItems: 1
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      id:
                        type: string
                      mime_type:
                        type: string
                      download_link:
                        type: string
                        format: uri
                    required:
                      - name
                      - download_link
                sections:
                  type: array
                  description: Optional section numbers to evaluate, e.g. [1, 2].
                  items:
                    type: integer
                subsections:
                  type: array
                  description: Optional subsection IDs to evaluate, e.g. ["1.1", "2.3"].
                  items:
                    type: string
                max_workers:
                  type: integer
                  description: Parallel OpenAI calls for repeated criterion evaluation. Default is 48.
                  minimum: 1
                  maximum: 48
      responses:
        "200":
          description: Job was accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                  message:
                    type: string
                  start_line:
                    type: string
                    description: >
                      Sentence confirming what was received and how long it will
                      take. Relay it to the user verbatim before polling.
                  document_name:
                    type: string
                  document_word_count:
                    type: integer
                  criteria_count:
                    type: integer
                  total:
                    type: integer
                  estimated_seconds:
                    type: integer
  /v3/jobs/{job_id}:
    get:
      operationId: getV3AppraisalJobStatus
      summary: Get v3 appraisal job status
      description: >
        Poll until status is succeeded or failed. After each call, write the returned progress_line to the user verbatim before calling again. Never make two calls in a row without writing something in between: the user sees nothing while you work.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current job status and summary when available.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - queued
                      - running
                      - succeeded
                      - failed
                  message:
                    type: string
                  progress_line:
                    type: string
                    description: >
                      A ready-to-use sentence describing current progress.
                      Relay it to the user verbatim; do not rewrite it.
                  percent_complete:
                    type: number
                  eta_seconds:
                    type: integer
                  completed:
                    type: integer
                  total:
                    type: integer
                  document_name:
                    type: string
                  document_word_count:
                    type: integer
                  summary:
                    type: object
                  error:
                    type: string
  /v3/jobs/{job_id}/result:
    get:
      operationId: getV3AppraisalResult
      summary: Get v3 appraisal XLSX result
      description: >
        Returns the completed summary, a small user-facing preview, and an XLSX
        file via openaiFileResponse. The workbook includes a friendly summary
        sheet plus a technical audit sheet with stability distribution. Call
        only after status is succeeded.
      x-openai-isConsequential: false
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completed result and downloadable XLSX file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                  summary:
                    type: object
                  result_preview:
                    type: array
                    items:
                      type: object
                  openaiFileResponse:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        mime_type:
                          type: string
                        content:
                          type: string
                          format: byte
components:
  schemas: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
